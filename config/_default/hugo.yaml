title: Daniel Adu Worae
baseURL: https://wadman.netlify.app/
defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true
cascade:
- target:
    path: /slides/**
    kind: page
  outputs:
  - HTML
  - present
build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles:
- .ipynb_checkpoints$
- \.Rmd$
- \.Rmarkdown$
- _cache$
disableAliases: true
outputs:
  home:
  - HTML
  - RSS
  - headers
  - redirects
  - backlinks
  section:
  - HTML
  - RSS
imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture
timeout: 600000
taxonomies:
  tag: tags
  publication_type: publication_types
markup:
  _merge: deep
  highlight:
    lineNos: false
security:
  _merge: deep
sitemap:
  _merge: deep
