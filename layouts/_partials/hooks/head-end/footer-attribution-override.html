<style>
/* Keep the footer minimal: site copyright/license only. */
footer a[href*="hugoblox.com"],
footer a[href*="templates/"] {
  display: none !important;
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('footer a[href*="hugoblox.com"], footer a[href*="templates/"]').forEach(function (link) {
    const block = link.closest('p, div, span');
    if (block && !block.textContent.includes('Daniel Adu Worae')) {
      block.remove();
    } else {
      link.remove();
    }
  });

  document.querySelectorAll('footer p, footer div').forEach(function (el) {
    const txt = el.textContent || '';
    if ((txt.includes('Made with Hugo') || txt.includes('Build your site') || txt.includes('Published with Hugo')) && !txt.includes('Daniel Adu Worae')) {
      el.remove();
    }
  });
});
</script>
